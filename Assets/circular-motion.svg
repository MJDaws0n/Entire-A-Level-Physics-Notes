<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
  <title id="title">Directions in circular motion</title>
  <desc id="desc">At a point on a circular path, velocity is tangent and centripetal acceleration and resultant force point inward.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1769aa"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#d1495b"/>
    </marker>
    <style>
      .path{fill:none;stroke:#8a99a8;stroke-width:4;stroke-dasharray:10 8}
      .radius{stroke:#52606d;stroke-width:3}
      .velocity{stroke:#1769aa;stroke-width:6;marker-end:url(#blueArrow)}
      .inward{stroke:#d1495b;stroke-width:6;marker-end:url(#redArrow)}
      text{font-family:system-ui,sans-serif;font-size:25px;fill:#17202a}
      .small{font-size:21px}
    </style>
  </defs>
  <rect width="760" height="540" rx="24" fill="#f7fafc"/>
  <circle class="path" cx="320" cy="285" r="190"/>
  <circle cx="320" cy="285" r="8" fill="#17202a"/>
  <circle cx="454" cy="151" r="15" fill="#1769aa"/>
  <line class="radius" x1="320" y1="285" x2="454" y2="151"/>
  <line class="velocity" x1="454" y1="151" x2="610" y2="307"/>
  <line class="inward" x1="445" y1="160" x2="345" y2="260"/>
  <text x="375" y="230">r</text>
  <text x="600" y="340" fill="#1769aa">v (tangent)</text>
  <text x="355" y="138" fill="#d1495b">a<tspan baseline-shift="sub" font-size="17">c</tspan>, F<tspan baseline-shift="sub" font-size="17">resultant</tspan></text>
  <text class="small" x="172" y="515">speed may be constant while velocity changes direction</text>
</svg>
